name: Public Staging CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-boundary:
    name: Public export boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify staging manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("EXPORT_MANIFEST.json").read_text())
          assert manifest["source_sha"] == "2cfa0ef54f8a951c93a0962b23767efc8cb3aa54"
          assert manifest["history_imported"] is False
          assert manifest["private_assets_imported"] is False
          assert manifest["visibility_target"] == "private_staging"
          assert manifest["sdk_binary_publication_approved"] is False
          assert manifest["public_release_ready"] is False
          assert manifest["frozen_contracts_modified"] is False
          print("PASS — staging manifest boundary")
          PY

      - name: Reject forbidden tracked paths
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"

          if printf '%s\n' "$tracked" | grep -E '(^|/)private-assets/|\.pte$|\.jks$|\.keystore$|\.p12$|\.pfx$|(^|/)google-services\.json$'; then
            echo "FAIL — forbidden private/binary/credential path is tracked" >&2
            exit 1
          fi

          echo "PASS — forbidden tracked paths absent"

      - name: Reject frozen/private implementation tokens
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'E805_XNNPACK.pte'
            'SEMANTIC_OOD_XNNPACK.pte'
            'exp009_android_golden'
            'EXP009_PROTOCOL_LOCK.json'
            'LdmConformanceEncoding'
            'conformanceEncode('
            'LDM_TASK_PRIORITY_KEYSTORE'
            'BEGIN PRIVATE KEY'
          )

          for pattern in "${patterns[@]}"; do
            if git grep -n -F "$pattern" -- . ':!.github/workflows/public-ci.yml'; then
              echo "FAIL — forbidden token found: $pattern" >&2
              exit 1
            fi
          done

          echo "PASS — frozen/private implementation tokens absent"

      - name: Bounded credential pattern scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          files = [Path(p.decode()) for p in tracked if p]
          patterns = {
              "github_classic_token": re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              "github_fine_grained_token": re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              "aws_access_key": re.compile(r"(?:AKIA|ASIA)[0-9A-Z]{16}"),
              "google_api_key": re.compile(r"AIza[0-9A-Za-z_-]{30,}"),
              "slack_token": re.compile(r"xox[baprs]-[0-9A-Za-z-]{20,}"),
              "stripe_live_secret": re.compile(r"sk_live_[0-9A-Za-z]{20,}"),
              "private_key_pem": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "secret_assignment": re.compile(
                  r"(?i)\b(password|passwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token)\b"
                  r"\s*[:=]\s*[\"']?([^\s\"'#]{8,})"
              ),
          }

          findings = []
          scanned = 0
          for path in files:
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              scanned += 1
              for name, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      line = text.count("\n", 0, match.start()) + 1
                      findings.append((str(path), line, name))

          if findings:
              for path, line, name in findings:
                  print(f"{path}:{line}: {name}")
              raise SystemExit("FAIL — credential-like material detected")

          print(f"PASS — bounded credential pattern scan ({scanned} tracked text files)")
          PY

      - name: Verify public CI has no signing-secret dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/public-ci.yml").read_text().lower()
          forbidden = [
              "secret" + "s.",
              "apk" + "signer",
              "jar" + "signer",
          ]
          hits = [token for token in forbidden if token in text]
          if hits:
              raise SystemExit(f"FAIL — public CI contains forbidden signing/secret dependency: {hits}")
          print("PASS — no signing-secret dependency")
          PY

      - name: Verify sample build configuration stays distribution-gated
        shell: bash
        run: |
          set -euo pipefail
          for settings in \
            samples/task-priority-android/settings.gradle.kts \
            samples/notification-timing-android/settings.gradle.kts; do
            grep -Fq 'LDM_SDK_REPOSITORY' "$settings"
            grep -Fq 'pending redistribution clearance' "$settings"
          done

          if git grep -n -E 'private-assets|releases/assets/646441073|repos/thrhead/mobile_jev' -- samples; then
            echo "FAIL — public samples reference private distribution infrastructure" >&2
            exit 1
          fi

          echo "PASS — build configuration remains explicitly distribution-gated"

  sdk-build:
    name: Sample build when public SDK repository is approved
    if: ${{ vars.LDM_PUBLIC_SDK_REPOSITORY != '' }}
    needs: static-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false

      - name: Ensure Android SDK platforms
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Build Task Priority sample
        shell: bash
        env:
          LDM_SDK_REPOSITORY: ${{ vars.LDM_PUBLIC_SDK_REPOSITORY }}
        run: |
          set -euo pipefail
          cd samples/task-priority-android
          gradle --no-daemon :app:assembleDebug

      - name: Build Notification Timing sample
        shell: bash
        env:
          LDM_SDK_REPOSITORY: ${{ vars.LDM_PUBLIC_SDK_REPOSITORY }}
        run: |
          set -euo pipefail
          cd samples/notification-timing-android
          gradle --no-daemon :app:assembleDebug
